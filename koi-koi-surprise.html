<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koi Koi 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --pond:#0f2a3a; --deep:#081a26; --koi:#ff6a3d; --petal:#ffc2d1;
  --paper:#f6ecd9; --ink:#2b1a1a; --gold:#d9a441;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 30% 20%,var(--pond),var(--deep) 70%);
  color:var(--paper);font-family:'Shippori Mincho',Georgia,serif;
  overflow-x:hidden;min-height:100vh;
}
#pond{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.koi{position:absolute;width:150px;left:-200px;opacity:.85;animation:swim linear infinite}
.koi svg{width:100%;animation:wiggle .9s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(calc(100vw + 400px))}}
@keyframes wiggle{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.petal{position:absolute;top:-20px;width:12px;height:12px;background:var(--petal);
  border-radius:80% 0 80% 0;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:48px 20px 80px;text-align:center}
h1{font-size:clamp(2.4rem,9vw,4.2rem);font-weight:700;letter-spacing:.04em}
.sub{margin-top:10px;font-size:1.05rem;opacity:.85}
.kanji{font-size:1rem;color:var(--gold);margin-top:6px}
.hint{margin:34px 0 18px;font-family:'Caveat',cursive;font-size:1.6rem;color:var(--petal)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:620px){.cards{grid-template-columns:repeat(4,1fr)}}
.card{aspect-ratio:2/3;perspective:800px;cursor:pointer;background:none;border:0;padding:0;color:inherit;font:inherit}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:10px}
.inner{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;
  border:2px solid var(--gold);box-shadow:0 8px 20px #0007}
.back{background:repeating-linear-gradient(45deg,#7a1f2b 0 10px,#8f2735 10px 20px);font-size:2.6rem;color:var(--gold)}
.front{background:var(--paper);color:var(--ink);transform:rotateY(180deg);gap:10px}
.front .sym{font-size:2.4rem;color:#b3263e}
.front p{font-size:.95rem;line-height:1.5}
#final{margin-top:34px;display:none}
#final.show{display:block}
button.big{background:var(--koi);color:#fff;border:0;border-radius:40px;padding:16px 38px;
  font:700 1.3rem 'Shippori Mincho',serif;cursor:pointer;box-shadow:0 8px 24px #ff6a3d66;animation:pulse 1.6s infinite}
button.big:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
@keyframes pulse{50%{transform:scale(1.06)}}
#overlay{position:fixed;inset:0;z-index:5;background:#081a26ee;display:none;
  align-items:center;justify-content:center;padding:24px;text-align:center}
#overlay.show{display:flex}
#overlay .box{max-width:520px}
#overlay h2{font-size:clamp(2rem,8vw,3.2rem);color:var(--petal)}
#overlay p{margin-top:18px;font-size:1.2rem;line-height:1.7}
.heart{position:fixed;bottom:-30px;z-index:6;animation:rise linear forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.koi,.petal,button.big,.koi svg{animation:none}.inner{transition:none}}
</style>
</head>
<body>
<div id="pond" aria-hidden="true"></div>

<main>
  <h1>Koi Koi</h1>
  <div class="kanji">恋 · こいこい</div>
  <p class="sub" id="sub"></p>
  <p class="hint">Tap each card to flip it</p>
  <div class="cards" id="cards"></div>
  <div id="final"><button class="big" id="finalBtn">Koi Koi! 💗</button></div>
</main>

<div id="overlay" role="dialog" aria-live="polite">
  <div class="box">
    <h2 id="finalTitle"></h2>
    <p id="finalText"></p>
    <p style="margin-top:28px"><button class="big" onclick="closeOv()" style="animation:none;font-size:1rem;padding:10px 26px">Close</button></p>
  </div>
</div>

<script>
/* ====== EDIT THIS PART ====== */
const HER_NAME = "My Love";
const FROM_NAME = "Me";
const SUBTITLE = "In Japanese, “koi” (恋) means love. And in the game Koi Koi, you say it when you want to keep going. So… let’s keep going, forever.";
const CARDS = [
  { sym:"桜", text:"Like cherry blossoms, you make every ordinary day feel special." },
  { sym:"月", text:"Even on my darkest nights, you are my moon." },
  { sym:"鯉", text:"Koi swim upstream and become dragons. With you, I feel like I can do anything." },
  { sym:"恋", text:"I fall for you a little more every single day." }
];
const FINAL_TITLE = "I love you!";
const FINAL_TEXT = "You are my best hand, my lucky card, my everything. Will you keep playing this game of life with me? Koi koi… 💗";
/* ============================ */

document.getElementById('sub').textContent = "For " + HER_NAME + " — " + SUBTITLE;
document.title = "Koi Koi 💗 for " + HER_NAME;

// swimming koi + petals
const koiSVG = `<svg viewBox="0 0 200 80"><path d="M10 40C40 5 120 5 170 36L198 14 190 40 198 66 170 44C120 75 40 75 10 40Z" fill="#ff6a3d"/><path d="M60 20C80 10 110 12 125 24 100 22 80 28 60 20Z" fill="#fff" opacity=".85"/><circle cx="32" cy="36" r="3.5" fill="#081a26"/></svg>`;
const pond = document.getElementById('pond');
for(let i=0;i<4;i++){
  const k=document.createElement('div');
  k.className='koi';
  k.style.top=(10+i*22)+'%';
  k.style.animationDuration=(26+i*7)+'s';
  k.style.animationDelay=(-i*8)+'s';
  k.style.width=(110+i*25)+'px';
  k.innerHTML=koiSVG;
  pond.appendChild(k);
}
for(let i=0;i<18;i++){
  const p=document.createElement('div');
  p.className='petal';
  p.style.left=Math.random()*100+'%';
  p.style.animationDuration=(8+Math.random()*10)+'s';
  p.style.animationDelay=(-Math.random()*14)+'s';
  pond.appendChild(p);
}

// cards
let opened=0;
const wrap=document.getElementById('cards');
CARDS.forEach(c=>{
  const b=document.createElement('button');
  b.className='card';
  b.setAttribute('aria-label','Flip card');
  b.innerHTML=`<div class="inner"><div class="face back">花</div><div class="face front"><div class="sym">${c.sym}</div><p>${c.text}</p></div></div>`;
  b.onclick=()=>{
    if(b.classList.contains('open'))return;
    b.classList.add('open');
    if(++opened===CARDS.length) document.getElementById('final').classList.add('show');
  };
  wrap.appendChild(b);
});

// finale
const ov=document.getElementById('overlay');
document.getElementById('finalBtn').onclick=()=>{
  document.getElementById('finalTitle').textContent=FINAL_TITLE;
  document.getElementById('finalText').textContent=FINAL_TEXT+"  — "+FROM_NAME;
  ov.classList.add('show');
  for(let i=0;i<40;i++){
    const h=document.createElement('div');
    h.className='heart';
    h.textContent=['💗','💖','🌸','💕'][i%4];
    h.style.left=Math.random()*100+'%';
    h.style.fontSize=(18+Math.random()*26)+'px';
    h.style.animationDuration=(3+Math.random()*3)+'s';
    h.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7000);
  }
};
function closeOv(){ov.classList.remove('show')}
</script>
</body>
</html>
